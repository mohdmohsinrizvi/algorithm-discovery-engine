[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algorithm-discovery-lab"
version = "0.1.0"
description = "Autonomous algorithm discovery, formal verification, and benchmarking platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Algorithm Discovery Lab Contributors" }]
keywords = ["algorithms", "discovery", "verification", "evolution", "sorting-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "websockets>=11.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]
ml = ["numpy>=1.24"]

[project.scripts]
adl = "algorithm_discovery_lab.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithm_discovery_lab"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
